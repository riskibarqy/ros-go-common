name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l config requestcontext failure httpapi grpcapi observability)"
      - name: Test with race detection
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...

  release:
    name: Tag Patch Release
    timeout-minutes: 5
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish next patch tag
        run: bash .github/scripts/tag-release.sh
